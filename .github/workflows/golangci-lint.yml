name: golangci-lint
on:
  pull_request:

permissions:
  contents: read
  # Write permissions are required in order to produce annotations.
  checks: write

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          only-new-issues: true
          args: -c ./.golangci.yml
